                                  handleGenerateContract();
                              }}
                              className="w-full bg-zinc-800 hover:bg-black text-white font-bold py-4 rounded-xl transition-all shadow-md flex items-center justify-center gap-2"
                          >
                              <i className="fa-solid fa-file-signature"></i> Complementar Informações
                          </button>
                      </div>

                      {/* Botões Administrativos */}
                      <div className="mt-4 pt-4 border-t border-zinc-100 space-y-3 print:hidden">
                        
                        <button onClick={addToCalendar} className="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 text-sm">
                            <i className="fa-regular fa-calendar-plus"></i> Marcar Evento na Agenda
                        </button>
                        
                        <button onClick={() => window.print()} className="w-full bg-zinc-100 hover:bg-zinc-200 text-zinc-800 font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 text-sm">
                          <i className="fa-solid fa-print"></i> Imprimir Rascunho
                        </button>

                        <div className="grid grid-cols-2 gap-3">
                          <button onClick={handleSaveLocal} className="w-full bg-white hover:bg-zinc-50 text-zinc-700 border border-zinc-200 font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 text-sm">
                            <i className="fa-solid fa-download"></i> Salvar (PC)
                          </button>
                          <button onClick={handleImportLocalClick} className="w-full bg-white hover:bg-zinc-50 text-zinc-700 border border-zinc-200 font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 text-sm">
                            <i className="fa-solid fa-upload"></i> Importar (PC)
                          </button>

                          <button onClick={handleSaveBudget} disabled={isSaving} className="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 text-sm">
                            {isSaving ? <span className="loader border-blue-700 border-t-transparent w-4 h-4"></span> : <i className="fa-solid fa-cloud-arrow-up"></i>} Salvar Nuvem
                          </button>
                          <button onClick={handleImportClick} className="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 text-sm">
                            <i className="fa-solid fa-cloud-arrow-down"></i> Importar Nuvem
                          </button>
                        </div>
                        <input type="file" accept=".json" ref={fileInputRef} onChange={handleFileUpload} style={{ display: 'none' }} />
                      </div>
                      
                    </div>
                  </div>

                </div>
              </div>

              {/* MODAL DE IMPORTAÇÃO DO GITHUB */}
              {showImportModal && (
                  <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 print:hidden">
                      <div className="bg-white rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl">
                          <div className="flex justify-between items-center p-6 border-b border-zinc-200">
                              <h2 className="text-xl font-bold text-zinc-800 flex items-center gap-2">
                                  <i className="fa-solid fa-cloud text-amber-500"></i>
                                  Orçamentos Salvos (GitHub)
                              </h2>
                              <button onClick={() => setShowImportModal(false)} className="text-zinc-400 hover:text-red-500 transition-colors">
                                  <i className="fa-solid fa-xmark text-2xl"></i>
                              </button>
                          </div>
                          
                          <div className="p-6 overflow-y-auto flex-1">
                              {isLoadingFiles ? (
                                  <div className="text-center py-10">
                                      <span className="loader border-zinc-300 border-t-amber-500 w-10 h-10 border-4"></span>
                                      <p className="mt-4 text-zinc-500 font-medium">Buscando orçamentos...</p>
                                  </div>
                              ) : githubFiles.length === 0 ? (
                                  <div className="text-center py-10 bg-zinc-50 rounded-xl border border-zinc-200">
                                      <i className="fa-regular fa-folder-open text-4xl text-zinc-300 mb-3"></i>
                                      <p className="text-zinc-500 font-medium">Nenhum orçamento encontrado.</p>
                                      <p className="text-xs text-zinc-400 mt-1">Salve um orçamento para que ele apareça aqui.</p>
                                  </div>
                              ) : (
                                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                      {githubFiles.map((file) => (
                                          <div key={file.sha} className="border border-zinc-200 rounded-xl p-4 hover:border-amber-400 hover:bg-amber-50 transition-colors flex flex-col justify-between group">
                                              <div className="mb-4">
                                                  <h3 className="font-bold text-zinc-700 text-sm break-all">
                                                      <i className="fa-regular fa-file-lines text-amber-500 mr-2"></i>
                                                      {file.name.replace('orcamento-', '').replace('.json', '').replaceAll('-', ' ').toUpperCase()}
                                                  </h3>
                                                  <p className="text-xs text-zinc-400 mt-1">{file.name}</p>
                                              </div>
                                              <button 
                                                  onClick={() => loadBudgetFromGithub(file.url)}
                                                  className="w-full bg-zinc-800 text-white text-xs font-bold py-2 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity"
                                              >
                                                  Carregar Dados
                                              </button>
                                          </div>
                                      ))}
                                  </div>
                              )}
                          </div>
                      </div>
                  </div>
              )}

              {/* MODAL DO CONTRATO E PAGAMENTO */}
              {showContractModal && (
                  <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 print:hidden">
                      <div className="bg-white rounded-2xl w-full max-w-6xl max-h-[95vh] flex flex-col shadow-2xl">
                          
                          <div className="flex justify-between items-center p-6 border-b border-zinc-200">
                              <h2 className="text-2xl font-bold font-serif text-zinc-800 flex items-center gap-2">
                                  <i className="fa-solid fa-file-contract text-amber-500"></i>
                                  Configuração do Contrato
                              </h2>
                              <button onClick={() => setShowContractModal(false)} className="text-zinc-400 hover:text-red-500 transition-colors">
                                  <i className="fa-solid fa-xmark text-2xl"></i>
                              </button>
                          </div>

                          <div className="p-6 overflow-y-auto flex-1 grid grid-cols-1 md:grid-cols-2 gap-8">
                              
                              {/* Formulário de Configuração (Esquerda) */}
                              <div className="space-y-6">
                                  
                                  {/* Dados Contratante */}
                                  <div>
                                      <h3 className="text-sm font-bold text-zinc-500 uppercase tracking-widest border-b pb-2 mb-4">Dados do Contratante</h3>
                                      <div className="space-y-4">
                                          <div>
                                              <label className="block text-sm font-medium text-zinc-700 mb-1">Nome Completo</label>
                                              <input type="text" value={clientName} onChange={(e) => setClientName(e.target.value)} className="w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl outline-none" />
                                          </div>
                                          <div className="grid grid-cols-2 gap-3">
                                              <div>
                                                  <label className="block text-sm font-medium text-zinc-700 mb-1">CPF</label>
                                                  <input type="text" value={clientCPF} onChange={(e) => setClientCPF(e.target.value)} placeholder="000.000.000-00" className="w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none" />
                                              </div>
                                              <div>
                                                  <label className="block text-sm font-medium text-zinc-700 mb-1">RG</label>
                                                  <input type="text" value={clientRG} onChange={(e) => setClientRG(e.target.value)} placeholder="00.000.000-0" className="w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none" />
                                              </div>
                                          </div>
                                          <div>
                                              <label className="block text-sm font-medium text-zinc-700 mb-1">Endereço Completo</label>
                                              <input type="text" value={clientAddress} onChange={(e) => setClientAddress(e.target.value)} placeholder="Rua, Número, Bairro, Cidade - Estado" className="w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none" />
                                          </div>
                                      </div>
                                  </div>

                                  {/* Desconto */}
                                  <div>
                                      <h3 className="text-sm font-bold text-zinc-500 uppercase tracking-widest border-b pb-2 mb-4">Desconto Exclusivo</h3>
                                      <div className="flex items-center gap-3 p-3 bg-zinc-50 border border-zinc-200 rounded-xl mb-3">
                                          <input type="checkbox" checked={hasDiscount} onChange={(e) => setHasDiscount(e.target.checked)} className="w-5 h-5 accent-amber-500" />
                                          <span className="text-sm font-medium text-zinc-700">Conceder Desconto?</span>
                                      </div>
                                      {hasDiscount && (
                                          <div>
                                              <label className="block text-xs font-medium text-zinc-500 mb-1">Porcentagem (%)</label>
                                              <input type="number" min="1" max="100" value={discountPercent} onChange={(e) => setDiscountPercent(e.target.value)} className="w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none" />
                                          </div>
                                      )}
                                  </div>

                                  {/* Condições Estruturadas de Pagamento */}
                                  <div>
                                      <h3 className="text-sm font-bold text-zinc-500 uppercase tracking-widest border-b pb-2 mb-4">Condições de Pagamento</h3>
                                      
                                      <div className="flex gap-4 mb-4">
                                          <button onClick={() => setPayType('avista')} className={`flex-1 p-2 rounded-xl border font-bold text-sm transition-all ${payType === 'avista' ? 'bg-amber-50 border-amber-500 text-amber-700' : 'bg-zinc-50 border-zinc-200 text-zinc-600'}`}>À Vista</button>
                                          <button onClick={() => setPayType('parcelado')} className={`flex-1 p-2 rounded-xl border font-bold text-sm transition-all ${payType === 'parcelado' ? 'bg-amber-50 border-amber-500 text-amber-700' : 'bg-zinc-50 border-zinc-200 text-zinc-600'}`}>Parcelado</button>
                                      </div>

                                      {payType === 'avista' && (
                                          <div className="p-4 border border-zinc-200 rounded-xl bg-zinc-50">
                                              <label className="block text-sm font-medium text-zinc-700 mb-1">Data do Pagamento</label>
                                              <input type="date" value={cashDate} onChange={e => setCashDate(e.target.value)} className="w-full p-3 bg-white border border-zinc-200 rounded-lg outline-none" />
                                          </div>
                                      )}

                                      {payType === 'parcelado' && (
                                          <div className="space-y-4">
                                              {/* Entrada */}
                                              <div className="p-4 border border-zinc-200 rounded-xl bg-zinc-50 space-y-3">
                                                  <h4 className="font-bold text-sm text-zinc-700">1. Entrada (Obrigatória)</h4>
                                                  <div className="grid grid-cols-2 gap-3">
                                                      <div>
                                                          <label className="block text-xs font-medium text-zinc-500 mb-1">Valor (R$)</label>
                                                          <div className="relative">
                                                              <input type="number" value={dpValue} onChange={e => setDpValue(e.target.value)} className="w-full p-2 pl-2 pr-12 border rounded-lg outline-none bg-white" />
                                                              <span className="absolute right-2 top-2 text-xs text-zinc-400 font-bold">{getPerc(dpValue)}%</span>
                                                          </div>
                                                      </div>
                                                      <div>
                                                          <label className="block text-xs font-medium text-zinc-500 mb-1">Data</label>
                                                          <input type="date" value={dpDate} onChange={e => setDpDate(e.target.value)} className="w-full p-2 border rounded-lg outline-none bg-white" />
                                                      </div>
                                                  </div>
                                                  <div>
                                                      <label className="block text-xs font-medium text-zinc-500 mb-1">Forma de Pagamento</label>
                                                      <select value={dpMethod} onChange={e => setDpMethod(e.target.value)} className="w-full p-2 border rounded-lg outline-none bg-white">
                                                          <option value="PIX">PIX</option>
                                                          <option value="Dinheiro">Dinheiro</option>
                                                          <option value="Cartão de Débito">Cartão de Débito</option>
                                                          <option value="Cartão de Crédito">Cartão de Crédito (1x)</option>
                                                          <option value="Cartão Parcelado">Cartão Parcelado</option>
                                                      </select>
                                                  </div>
                                                  {dpMethod === 'Cartão Parcelado' && (
                                                      <div>
                                                          <label className="block text-xs font-medium text-zinc-500 mb-1">Parcelar entrada em (vezes):</label>
                                                          <input type="number" min="2" value={dpInstallments} onChange={e => setDpInstallments(e.target.value)} className="w-full p-2 border rounded-lg outline-none bg-white" />
                                                      </div>
                                                  )}
                                              </div>

                                              {/* Saldo/Parcelas */}
                                              <div className="p-4 border border-zinc-200 rounded-xl bg-zinc-50 space-y-3">
                                                  <h4 className="font-bold text-sm text-zinc-700">2. Parcelamento do Saldo</h4>
                                                  <div className="grid grid-cols-2 gap-3">
                                                      <div>
                                                          <label className="block text-xs font-medium text-zinc-500 mb-1">Qtd. de Parcelas</label>
                                                          <input type="number" min="1" value={instCount} onChange={e => setInstCount(e.target.value)} className="w-full p-2 border rounded-lg outline-none bg-white" />
                                                      </div>
                                                      <div>
                                                          <label className="block text-xs font-medium text-zinc-500 mb-1">Valor de CADA (R$)</label>
                                                          <div className="relative">
                                                              <input type="number" value={instValue} onChange={e => setInstValue(e.target.value)} className="w-full p-2 pl-2 pr-12 border rounded-lg outline-none bg-white" />
                                                              <span className="absolute right-2 top-2 text-xs text-zinc-400 font-bold">{getPerc(instValue * instCount)}%</span>
                                                          </div>
                                                      </div>
                                                  </div>
                                                  <div className="flex justify-end">
                                                      <button type="button" onClick={() => {
                                                          const remaining = finalDiscountedCost - parseFloat(dpValue || 0);
                                                          const suggested = remaining > 0 ? (remaining / parseInt(instCount || 1)) : 0;
                                                          setInstValue(suggested.toFixed(2));
                                                      }} className="text-[11px] text-amber-600 font-bold hover:underline">
                                                          Autocalcular Parcela
                                                      </button>
                                                  </div>
                                                  <div className="grid grid-cols-2 gap-3">
                                                      <div>
                                                          <label className="block text-xs font-medium text-zinc-500 mb-1">1º Vencimento</label>
                                                          <input type="date" value={instFirstDate} onChange={e => setInstFirstDate(e.target.value)} className="w-full p-2 border rounded-lg outline-none bg-white" />
                                                      </div>
                                                      <div>
                                                          <label className="block text-xs font-medium text-zinc-500 mb-1">Forma de Pagto</label>
                                                          <select value={instMethod} onChange={e => setInstMethod(e.target.value)} className="w-full p-2 border rounded-lg outline-none bg-white">
                                                              <option value="PIX">PIX</option>
                                                              <option value="Boleto">Boleto Bancário</option>
                                                              <option value="Cartão de Crédito">Cartão Recorrente</option>
                                                              <option value="Transferência">Transferência</option>
                                                          </select>
                                                      </div>
                                                  </div>
                                              </div>

                                              {/* Validação */}
                                              <div className={`p-3 rounded-lg flex items-center justify-between border ${isPagamentoValido ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800'}`}>
                                                  <span className="text-xs font-bold uppercase tracking-wider">
                                                      {isPagamentoValido ? '✅ Soma Correta' : '⚠️ Erro na Soma'}
                                                  </span>
                                                  <span className="text-sm font-bold">{formatCurrency(totalCalculado)} / {formatCurrency(finalDiscountedCost)}</span>
                                              </div>
                                          </div>
                                      )}
                                  </div>

                                  <div className="space-y-3 mt-6">
                                      <button 
                                          onClick={handleGenerateContract}
                                          className="w-full bg-zinc-800 hover:bg-black text-white font-bold py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2"
                                      >
                                          <i className="fa-solid fa-arrows-rotate"></i> Atualizar Texto do Contrato
                                      </button>
                                      
                                      <div className="grid grid-cols-2 gap-3">
                                          <button 
                                              onClick={handleSaveLocal}
                                              className="w-full bg-white hover:bg-zinc-50 text-zinc-700 border border-zinc-200 font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 text-sm"
                                          >
                                              <i className="fa-solid fa-download"></i> Salvar Info (PC)
                                          </button>
                                          
                                          <button 
                                              onClick={handleSaveBudget}
                                              disabled={isSaving}
                                              className="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 text-sm"
                                          >
                                              {isSaving ? <span className="loader border-blue-700 border-t-transparent w-4 h-4"></span> : <i className="fa-solid fa-cloud-arrow-up"></i>} Salvar Info (Nuvem)
                                          </button>

                                          <button 
                                              onClick={handlePrintContract}
                                              className="col-span-2 w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 text-sm"
                                          >
                                              <i className="fa-solid fa-print"></i> Imprimir Contrato (PDF)
                                          </button>
                                      </div>
                                  </div>
                              </div>

                              {/* Visualização do Contrato (Direita) */}
                              <div className="flex flex-col h-full">
                                  <h3 className="text-sm font-bold text-zinc-500 uppercase tracking-widest border-b pb-2 mb-4 flex justify-between items-center">
                                      Visualização e Edição Rápida
                                      <button onClick={handleCopyContract} className="text-amber-600 hover:text-amber-800 text-xs flex items-center gap-1 bg-amber-50 px-3 py-1 rounded-md transition-colors">
                                          <i className="fa-regular fa-copy"></i> Copiar Tudo
                                      </button>
                                  </h3>
                                  <div className="contract-box flex-1 outline-none shadow-inner" contentEditable suppressContentEditableWarning onBlur={(e) => setContractText(e.target.innerText)}>
                                      {contractText}
                                  </div>
                              </div>

                          </div>
                      </div>
                  </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
